name: Release

# Release Please: conventional commits on main keep a running release PR
# open; merging it is the owner-approval gesture. On merge, release-please
# bumps the version, updates the changelog, cuts the v* tag + GitHub
# Release, and THIS run publishes — a token-created tag would not trigger
# a separate publish workflow. Manual v* tag pushes still publish
# directly (fallback path).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # PAT (RELEASE_PLEASE_TOKEN) makes release-please's PRs run CI
          # normally; GITHUB_TOKEN-authored PRs get their workflows stuck
          # at action_required, which required checks can never satisfy.
          # Fallback keeps the old behavior until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: >-
      always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml and the @tenacity-labs/knapsack
          # measurements; unpinned drift changes numbers silently.
          bun-version: 1.3.14
      # Same gates as CI: frozen lockfile, types, tests.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # setup-node writes the .npmrc that maps NODE_AUTH_TOKEN to the
      # GitHub Packages registry; publishConfig.registry targets it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
