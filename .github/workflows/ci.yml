name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # dorny/test-reporter needs this to create check runs / annotations.
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the coverage gate diffs against the merge-base.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match @tenacity-labs/knapsack measurements (see that
          # repo's CI note); unpinned drift changes numbers silently.
          bun-version: 1.3.14
      # Frozen means frozen: a mismatched lockfile is an error, not a
      # silent regeneration.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # One run, two outputs: JUnit XML for the parsed report + raw
      # artifact, lcov for the coverage summary + raw artifact.
      - name: Test (junit + lcov)
        run: >
          bun test
          --reporter=junit --reporter-outfile=test-results.xml
          --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Upload test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Code coverage"
            bun scripts/coverage-summary.ts coverage/lcov.info
          } >> "$GITHUB_STEP_SUMMARY"
      # Gate: total coverage never decreases (ratchet vs the base), and
      # new src/ code is >= 80% covered. The base's coverage comes from
      # running the same suite on the merge-base (PRs) / parent commit
      # (pushes) in a worktree — stateless, no stored baseline to drift.
      - name: Coverage gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin main
            BASE=$(git merge-base HEAD origin/main)
          else
            BASE=HEAD^
          fi
          echo "Coverage gate base: $BASE"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          (
            cd "$RUNNER_TEMP/base"
            bun install --frozen-lockfile
            bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
          )
          {
            bun scripts/coverage-gate.ts coverage/lcov.info "$RUNNER_TEMP/base/coverage/lcov.info" "$BASE"
          } >> "$GITHUB_STEP_SUMMARY"
      # v3 default surface is the job summary on the run page; on failure
      # it also annotates the offending files/lines.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests
          path: test-results.xml
          reporter: java-junit

  bench:
    # PRs: cache-backed history, comparison summary + PR comment, no writes
    # to tracked branches. main: history + charts on the gh-pages branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # gh-pages benchmark history
      deployments: write   # gh-pages deployment
      pull-requests: write # comment-always
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run bench
        run: bun bench/relief-dp.ts --json > bench.json
      - name: Restore PR bench history
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ./cache
          key: benchmark-data-${{ runner.os }}
      - name: Track bench result (PR)
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: relief-dp
          tool: customSmallerIsBetter
          output-file-path: bench.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: true
          summary-always: true
          # Display + track only: ubuntu runners are too noisy to gate on.
          alert-threshold: "200%"
          fail-on-alert: false
      - name: Track bench result (main)
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: relief-dp
          tool: customSmallerIsBetter
          output-file-path: bench.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-always: true
          summary-always: true
          alert-threshold: "200%"
          fail-on-alert: false
